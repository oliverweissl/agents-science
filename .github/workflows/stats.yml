name: Update repo stats
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths: [projects.json, scripts/update_stats.py, .github/workflows/stats.yml]
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Update repo stats" && git push)
